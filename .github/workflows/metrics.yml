name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN (read-only PAT) is needed to see all repos and languages;
          # GITHUB_TOKEN only sees this repository.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Puhavik
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Vienna
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, jupyter notebook
